<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Orkavyn Agro Intelligence — Verificação em duas etapas</title>
    <style>
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        body { font-family: sans-serif; background: #f4f7f6; display: flex; align-items: center; justify-content: center; min-height: 100dvh; padding: 20px 16px; padding-bottom: max(20px, env(safe-area-inset-bottom)); }
        .login-card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { color: #2c3e50; margin-bottom: .5rem; text-align: center; }
        .sub { color: #666; font-size: .88rem; text-align: center; margin-bottom: 1.5rem; line-height: 1.5; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; color: #666; font-size: .9rem; }
        input { width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 4px; font-size: 1.4rem; text-align: center; letter-spacing: .4em; font-family: monospace; }
        button { width: 100%; padding: 0.875rem; background: #27ae60; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; min-height: 48px; }
        button:hover { background: #219150; }
        .links { margin-top: 1rem; text-align: center; font-size: 0.9rem; }
        .links a { color: #2980b9; text-decoration: none; }
        .flash { padding: 0.75rem; margin-bottom: 1rem; border-radius: 4px; background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .ajuda { margin-top: 1.25rem; padding-top: 1rem; border-top: 1px solid #eee; font-size: .82rem; color: #777; line-height: 1.6; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>Verificação em duas etapas</h2>
        <p class="sub">Digite o código de 6 dígitos do seu aplicativo autenticador.</p>

        {% if erro %}
          <div class="flash">{{ erro }}</div>
        {% endif %}

        <form method="POST">
            <div class="form-group">
                <label>Código</label>
                <input type="text" name="codigo" inputmode="numeric"
                       autocomplete="one-time-code" maxlength="9"
                       pattern="[0-9a-zA-Z\-]*" required autofocus>
            </div>
            <button type="submit">Entrar</button>
        </form>

        <div class="ajuda">
            Sem acesso ao aplicativo? Use um dos <strong>códigos de recuperação</strong>
            que você guardou ao ativar — cada um vale uma única vez.
        </div>

        <div class="links">
            <a href="/login">Voltar</a>
        </div>
    </div>
</body>
</html>
