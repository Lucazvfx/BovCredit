<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Recuperar Senha</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Arial,sans-serif;background:#f4f7f6;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
    .card{background:white;padding:2rem;border-radius:10px;box-shadow:0 4px 12px rgba(0,0,0,.08);width:100%;max-width:400px}
    h2{color:#2c3e50;margin-bottom:.5rem;font-size:1.4rem}
    .sub{color:#777;font-size:.9rem;margin-bottom:1.5rem;line-height:1.5}
    label{display:block;font-size:.85rem;color:#555;margin-bottom:.3rem;font-weight:600}
    input{width:100%;padding:.65rem .8rem;border:1px solid #ddd;border-radius:6px;font-size:.95rem;outline:none;transition:border-color .2s}
    input:focus{border-color:#2980b9}
    .btn{width:100%;padding:.75rem;background:#2980b9;color:white;border:none;border-radius:6px;font-size:1rem;font-weight:600;cursor:pointer;margin-top:1rem;transition:background .2s}
    .btn:hover{background:#2471a3}
    .btn:disabled{background:#aaa;cursor:not-allowed}
    .msg{margin-top:1rem;padding:.7rem .9rem;border-radius:6px;font-size:.88rem;line-height:1.5}
    .msg.ok{background:#e8f5e9;color:#2e7d32;border-left:3px solid #4caf50}
    .msg.err{background:#fdecea;color:#c0392b;border-left:3px solid #e74c3c}
    .back{display:block;text-align:center;margin-top:1.25rem;color:#2980b9;text-decoration:none;font-size:.9rem}
    .back:hover{text-decoration:underline}
  </style>
</head>
<body>
<div class="card">
  <h2>Recuperar Senha</h2>
  <p class="sub">Informe seu e-mail de cadastro e enviaremos um link para criar uma nova senha.</p>

  {% if erro %}
  <div class="msg err">{{ erro }}</div>
  {% endif %}

  <form id="form" onsubmit="enviar(event)">
    <div style="margin-bottom:1rem">
      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" placeholder="seu@email.com" required autofocus>
    </div>
    <button class="btn" id="btn" type="submit">Enviar instruções</button>
  </form>

  <div id="msg" class="msg" style="display:none"></div>
  <a class="back" href="{{ url_for('login') }}">← Voltar ao login</a>
</div>

<script>
async function enviar(e){
  e.preventDefault();
  const btn = document.getElementById('btn');
  const msgEl = document.getElementById('msg');
  const email = document.getElementById('email').value.trim();
  btn.disabled = true;
  btn.textContent = 'Enviando...';
  msgEl.style.display = 'none';
  try{
    const res = await fetch('/api/esqueci-senha', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({email})
    });
    const data = await res.json();
    if(data.ok){
      document.getElementById('form').style.display = 'none';
      msgEl.className = 'msg ok';
      msgEl.textContent = data.mensagem;
      msgEl.style.display = 'block';
    } else {
      msgEl.className = 'msg err';
      msgEl.textContent = data.erro || 'Erro ao processar. Tente novamente.';
      msgEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Enviar instruções';
    }
  }catch(err){
    msgEl.className = 'msg err';
    msgEl.textContent = 'Erro de conexão. Tente novamente.';
    msgEl.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Enviar instruções';
  }
}
</script>
</body>
</html>
