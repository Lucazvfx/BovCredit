<aside class="ork-sidebar" aria-label="Navegação principal">
  <a class="ork-brand" href="/app" aria-label="Orkavyn Agro Intelligence — início">
    <img class="ork-brand__mark" src="/static/img/logo-light.svg" alt="Orkavyn Agro Intelligence">
  </a>

  <nav class="ork-nav">
    <span class="ork-nav__label">Análise econômico-produtiva</span>
    <button class="ork-nav__item is-active" type="button" data-ork-nav="entrada" onclick="showTab('entrada', this)">
      <span class="ork-nav__icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16v16H4z"/><path d="M8 9h8M8 13h5M8 17h3"/></svg></span>
      <span>Nova análise</span>
    </button>
    <button class="ork-nav__item" type="button" data-ork-nav="resultado" onclick="showTab('resultado', this)">
      <span class="ork-nav__icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10h4v10M10 20V4h4v16M16 20v-7h4v7"/></svg></span>
      <span>Resultado</span>
    </button>
    <button class="ork-nav__item" type="button" data-ork-nav="cenarios" onclick="showTab('cenarios', this)">
      <span class="ork-nav__icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 4v16M6 8h7a4 4 0 0 1 4 4v1"/><path d="m14 10 3 3 3-3M6 16h5"/></svg></span>
      <span>Cenários</span>
    </button>
    <button class="ork-nav__item" type="button" data-ork-nav="historico" onclick="showTab('historico', this)">
      <span class="ork-nav__icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg></span>
      <span>Histórico</span>
    </button>

    <span class="ork-nav__label">Lavoura perene</span>
    <button class="ork-nav__item" type="button" data-ork-nav="perene" onclick="showTab('perene', this)">
      <span class="ork-nav__icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21v-7"/><path d="M12 14c-3.5 0-5-2.2-5-5 3.5 0 5 2.2 5 5Z"/><path d="M12 14c3.5 0 5-2.2 5-5-3.5 0-5 2.2-5 5Z"/><path d="M8 21h8"/></svg></span>
      <span>Café e cana</span>
    </button>

    <span class="ork-nav__label ork-nav__label--support">Suporte</span>
    <button class="ork-nav__item" type="button" data-ork-nav="ajuda" onclick="showTab('ajuda', this)">
      <span class="ork-nav__icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.8 9a2.4 2.4 0 1 1 3.4 2.2c-.8.4-1.2.9-1.2 1.8M12 17h.01"/></svg></span>
      <span>Ajuda</span>
    </button>
  </nav>

  <div class="ork-sidebar__account">
    <span class="ork-sidebar__user">{{ usuario.nome or usuario.email }}</span>
    <a class="ork-sidebar__logout" href="/logout">Sair da conta</a>
  </div>
</aside>
