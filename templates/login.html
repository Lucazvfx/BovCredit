<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BovCredit - Login</title>
    <style>
        body { font-family: sans-serif; background: #f4f7f6; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { color: #2c3e50; margin-bottom: 1.5rem; text-align: center; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; color: #666; }
        input { width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 0.75rem; background: #27ae60; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; }
        button:hover { background: #219150; }
        .links { margin-top: 1rem; text-align: center; font-size: 0.9rem; }
        .links a { color: #2980b9; text-decoration: none; }
        .flash { padding: 0.75rem; margin-bottom: 1rem; border-radius: 4px; background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>BovCredit — Entrar</h2>
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            {% for message in messages %}
              <div class="flash">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}
        {% if erro %}
          <div class="flash">{{ erro }}</div>
        {% endif %}
                <form method="POST">
                    <!-- CSRF token not injected: app does not require Flask-WTF by default -->
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" required autofocus>
            </div>
            <div class="form-group">
                <label>Senha</label>
                <input type="password" name="senha" required>
            </div>
            <button type="submit">Entrar</button>
        </form>
        <div class="links">
            <a href="{{ url_for('esqueci_senha') }}" style="color:#e67e22">Esqueceu a senha?</a>
        </div>
        <div style="margin-top:20px;padding-top:16px;border-top:1px solid #eee;text-align:center;font-size:.75rem;color:#aaa">
            Ao entrar, você concorda com os
            <a href="/termos" target="_blank" style="color:#aaa">Termos de Uso</a> e a
            <a href="/privacidade" target="_blank" style="color:#aaa">Política de Privacidade</a>.
        </div>
    </div>
</body>
</html>
