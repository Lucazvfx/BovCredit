<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Orkavyn — Nova senha</title>
  <link rel="icon" type="image/png" href="/static/favicon-cow.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Barlow:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='orkavyn-fields.css') }}">
</head>
<body class="ork-surface ork-auth-page">

  <main class="ork-auth-layout">

    <aside class="ork-auth-intro">
      <a class="ork-brand" href="/" aria-label="Orkavyn Agro Intelligence — início">
        <img src="/static/img/logo-dark.svg" alt="Orkavyn">
      </a>
      <p class="ork-kicker">Nova credencial</p>
      <h1>Proteja a continuidade da análise.</h1>
      <p>Defina uma nova senha para recuperar o acesso ao ambiente de inteligência pecuária.</p>
    </aside>

    <section class="ork-auth-card" aria-labelledby="nova-heading">
      <h2 id="nova-heading">Criar nova senha</h2>
      <p class="sub" style="margin-bottom:28px;font-size:.9rem">Escolha uma senha forte para sua conta.</p>

      <form id="form" novalidate>
        <input type="hidden" id="token" value="{{ token }}">
        <div class="field">
          <label for="f-nova">Nova senha</label>
          <input type="password" id="f-nova" name="nova_senha" required minlength="8" autofocus autocomplete="new-password" placeholder="Mínimo 8 caracteres">
        </div>
        <div class="field">
          <label for="f-confirma">Confirmar senha</label>
          <input type="password" id="f-confirma" name="confirmar_senha" required minlength="8" autocomplete="new-password" placeholder="Repita a senha">
        </div>
        <button id="btn" type="submit" style="margin-top:8px;cursor:pointer;letter-spacing:.04em">Salvar nova senha</button>
      </form>

      <div id="msg" class="msg" style="display:none" role="status"></div>

      <div class="links" style="margin-top:18px;font-size:.82rem">
        <a href="{{ url_for('login') }}">← Voltar ao login</a>
      </div>
    </section>

  </main>

  <script>
    document.getElementById('form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const btn = document.getElementById('btn');
      const msgEl = document.getElementById('msg');
      const nova = document.getElementById('f-nova').value;
      const confirma = document.getElementById('f-confirma').value;
      const token = document.getElementById('token').value;

      if (nova !== confirma) {
        msgEl.className = 'msg err';
        msgEl.textContent = 'As senhas não coincidem.';
        msgEl.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Salvando…';
      msgEl.style.display = 'none';

      try {
        const res = await fetch('/api/redefinir-senha', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, nova_senha: nova, confirmar_senha: confirma })
        });
        const data = await res.json();
        if (data.ok) {
          document.getElementById('form').style.display = 'none';
          msgEl.className = 'msg ok';
          msgEl.textContent = data.mensagem + ' Redirecionando…';
          msgEl.style.display = 'block';
          setTimeout(() => { window.location.href = '/login'; }, 2000);
        } else {
          msgEl.className = 'msg err';
          msgEl.textContent = data.erro || 'Erro ao salvar. Tente novamente.';
          msgEl.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'Salvar nova senha';
        }
      } catch (err) {
        msgEl.className = 'msg err';
        msgEl.textContent = 'Erro de conexão. Tente novamente.';
        msgEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Salvar nova senha';
      }
    });
  </script>

</body>
</html>
