name: deploy

# Roda depois de "tests" passar em main — nunca antes. Um push que quebra a
# suíte não deve chegar a tocar o servidor de produção.
on:
  workflow_run:
    workflows: ["tests"]
    branches: [main]
    types: [completed]
  workflow_dispatch:   # redeploy manual, sem precisar de commit novo

permissions:
  contents: read

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Sem ações de terceiros de propósito — só ssh, que o runner já traz.
      # Superfície de supply-chain menor para um workflow com acesso de
      # produção.
      - name: Configurar chave SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      # StrictHostKeyChecking=accept-new no lugar de um passo de ssh-keyscan.
      #
      # O keyscan derrubou o deploy do commit bbdc5f4 com um soluço de rede de
      # cinco segundos, e o `2>/dev/null` que ele tinha engoliu o motivo — o
      # log só dizia "exit code 1". Duas falhas de uma vez: frágil e mudo.
      #
      # A confiança na chave do host não muda: o keyscan aceitava a chave que
      # respondesse naquele instante, que é o mesmo TOFU do accept-new. A
      # diferença é que agora não há um passo separado para falhar sozinho.
      # Sobe o commit que a suíte aprovou, não o que estiver na ponta de main
      # no instante do deploy. `git pull origin main` deixava uma janela: um
      # push durante o job publicava código que nunca rodou os testes.
      # Em workflow_dispatch não há workflow_run, então cai no SHA do próprio
      # disparo — que é o que o usuário escolheu redeployar.
      - name: Atualizar e subir no VPS
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=15 root@179.198.115.127 "
            set -e
            cd /opt/orkavyn
            git fetch origin main
            git checkout --detach '$SHA'
            docker compose up -d --build
          "

      - name: Verificar que o site respondeu
        run: |
          sleep 15
          curl -sSf -o /dev/null https://credito.orkavyn.tech/ \
            || (echo "::error::Site não respondeu depois do deploy" && exit 1)

      - name: Limpar chave temporária
        if: always()
        run: rm -f ~/.ssh/deploy_key
