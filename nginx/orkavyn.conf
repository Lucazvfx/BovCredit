# Configuração HTTP. O TLS é adicionado pelo `certbot --nginx`, que duplica
# este server block, injeta as diretivas ssl_* e cria o redirect 80 → 443.
#
# Este arquivo JÁ TRAZIA um bloco 443 pronto, com ssl_certificate apontando
# para /etc/letsencrypt/live/. Numa máquina nova esses arquivos não existem
# ainda, então o `nginx -t` do script de setup falhava antes de o certbot ter
# a chance de emitir o certificado — e o setup abortava no meio.
server {
    listen 80;
    server_name seudominio.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    client_max_body_size 20M;

    # Arquivos estáticos servidos direto pelo nginx
    location /static/ {
        alias /opt/orkavyn/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
